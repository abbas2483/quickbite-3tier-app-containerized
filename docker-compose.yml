services:
 mongodb:
  image: mongo:latest
  container_name: quickbitedb
  volumes: 
   - mongodb_data:/data/db
  ports:
   - "27017:27017"
 backend:
  build:
   context: .
   dockerfile: Dockerfile.be
  container_name: backend
  ports:
   - "5001:5001"
  environment:
   - MONGO_URI=mongodb://mongodb:27017/foodiehub
   - PORT=5001
  depends_on:
   - mongodb
 frontend:
  build:
   context: .
   dockerfile: Dockerfile.fe
  container_name: frontend
  ports: 
   - "8001:80"
  depends_on: 
   - backend
volumes:
 mongodb_data:
